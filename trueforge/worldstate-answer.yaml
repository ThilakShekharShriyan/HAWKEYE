# Registered by `npm run trueforge:setup` through @truefoundry/trueforge-sdk.
# The harness is `npx @truefoundry/trueforge` (http://localhost:8790).
# Model credentials stay in Settings → Models. This file never holds an API key.
# FalkorDB is the MCP server `falkordb` (HTTP on port 3005).
# The graph skill is attached with the sandbox. Local `npx` mode has a sandbox
# fallback, so Daytona is only needed for a hosted TrueForge.
name: worldstate-answer
description: Answers a spoken question about a shared physical place from the WORLDSTATE graph.
manifest:
  model:
    name: openai/gpt-5-4-mini
    params:
      temperature: 0.2
  instructions: |
    You are WORLDSTATE. Answer a spoken question about a shared physical place.
    The world state in the message is the truth for what is there now.
    A taken or gone event means the thing left. When a graph path is shown, use it to say who saw it and which place it was.
    Two places of the same kind are different places: "table" and "table 2" are not the same node.
    Use the FalkorDB tools when you need a path the message does not already contain. Read only.
    Use the worldstate-graph skill when you need the Cypher for who has what, who took it, or what to buy.
    Use live web listings only to say where something could be bought.
    One or two short sentences, no markdown. The answer is spoken aloud.
  mcp_servers:
    - name: falkordb
      enable_tools:
        - query_graph_readonly
        - list_graphs
        - get_graph_schema
        - get_node_schema
        - get_relationship_schema
      require_approval_for_tools: []
      preload: false
  skills:
    - name: worldstate-graph
      preload: false
  response_format:
    type: text
  config:
    iteration_limit: 8
    sandbox:
      enabled: true
    web_search:
      enabled: false
    ask_user_questions:
      enabled: false
    dynamic_sub_agents:
      enabled: false
    generative_ui:
      enabled: false
